<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MO Dispersed Camping</title>
  </head>
  <body>
    <div id="app">
      <header id="app-header">
        <h1>MO Dispersed Camping</h1>
        <span class="header-tagline">Free camping on Missouri public land</span>
      </header>
      <button id="sidebar-toggle" aria-label="Toggle filters" aria-expanded="true">☰ Filters</button>
      <aside id="sidebar">
        <h2>Filter Sites</h2>
        <div class="filter-section">
          <label for="search-input">Search by name</label>
          <input type="search" id="search-input" placeholder="e.g. Noblett" autocomplete="off" />
        </div>
        <div class="filter-section" id="filter-land-manager">
          <h3>Land manager</h3>
          <div class="checkbox-group"></div>
        </div>
        <div class="filter-section" id="filter-access">
          <h3>Access</h3>
          <div class="checkbox-group"></div>
        </div>
        <div class="filter-section" id="filter-amenities">
          <h3>Amenities</h3>
          <div class="checkbox-group"></div>
        </div>
        <button id="reset-filters" type="button">Reset filters</button>
        <div class="filter-section" id="offline-section">
          <h3>Offline basemap</h3>
          <div id="offline-controls"></div>
        </div>
      </aside>
      <div id="map"></div>
      <div id="loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading map&hellip;</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
